name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  VCF_VALIDATOR_VERSION: "0.10.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The writer's tests run vcf_validator on the VCFs they write, when it is on the PATH.
      - name: Install vcf-validator
        run: |
          curl -LJo /usr/local/bin/vcf_validator \
            https://github.com/EBIvariation/vcf-validator/releases/download/v${VCF_VALIDATOR_VERSION}/vcf_validator_linux
          chmod 755 /usr/local/bin/vcf_validator

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'

      - name: Test install
        run: dgva-extraction --help

      - name: Test with pytest
        run: pytest -v
