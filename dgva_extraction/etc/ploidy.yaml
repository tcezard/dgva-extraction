# Ploidy per species, used to write a call's genotype from its zygosity (dgva_extraction/genotype.py).
#
# Keyed by NCBI taxonomy ID (GENOME_ASSEMBLY.ASSEMBLY_TAXONOMY_ID). A species missing from this map fails the study
# when a genotype has to be written, so the map stays explicit. Check it against the taxonomy IDs in the output of
# `dgva-extraction list-studies` (column assembly_taxonomy_id).
#
#   name:        for readers only
#   ploidy:      ploidy of the nuclear chromosomes
#   chromosomes: exceptions, by chromosome name as in the VCF (mitochondrion and chloroplast are haploid)
#
# Sex chromosomes are not listed: their ploidy depends on the sample's sex, which the zygosity (Hemizygous) gives
# when the submitter recorded it.

