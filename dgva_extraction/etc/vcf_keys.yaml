# VCF keys written by dgva-extraction (sprint 3, ticket 10).
#
# This file is the single source for the keys: the writer refuses any INFO or FORMAT value whose key is not listed
# here (a value with no target fails the study), checks Number and Type, and writes the header lines from it.
# Header lines and INFO keys are always written in the order of this file; only the keys a VCF uses are written.
#
# Fields:
#   field:       INFO or FORMAT
#   number:      VCF Number (an integer, A, R, G or .)
#   type:        Integer, Float, Flag, Character or String
#   description: written in the header
#   source:      where the value comes from in the DGVa database
#   reserved:    true when the key is reserved by VCF 4.4 (its Number and Type follow the specification)
#   status:      agreed (ticket 10: name and definition decided) or proposed (still to be decided)
#   sprint:      the sprint whose reader fills it (3: core fields; 4: gap fields)
#
# The decisions of ticket 10 are in docs/vcf-representation.md. Naming rules (2026-11-20): a VCF 4.4 reserved key
# first, then a key EVA already writes, then a new long, descriptive name; no key for a value encoded elsewhere.

- key: END
  field: INFO
  number: 1
  type: Integer
  description: End position of the longest variant described in this record
  source: VARIANT_PLACEMENT_STOP (or outer/inner stop); for insertions, POS
  reserved: true
  status: agreed
  sprint: 3

- key: SVLEN
  field: INFO
  number: A
  type: Integer
  description: Length of structural variant
  source: Derived from start and stop
  reserved: true
  status: agreed
  sprint: 3

- key: IMPRECISE
  field: INFO
  number: 0
  type: Flag
  description: Imprecise structural variation
  source: Set when CIPOS or CIEND is not 0,0
  reserved: true
  status: agreed
  sprint: 3

- key: CIPOS
  field: INFO
  number: 2
  type: Integer
  description: Confidence interval around POS for symbolic structural variants
  source: VARIANT_PLACEMENT_CIPOSLEFT/RIGHT; else VARIANT_PLACEMENT_CI_START; else outer and inner start
  reserved: true
  status: agreed
  sprint: 3

- key: CIEND
  field: INFO
  number: 2
  type: Integer
  description: Confidence interval around END for symbolic structural variants
  source: VARIANT_PLACEMENT_CIENDLEFT/RIGHT; else VARIANT_PLACEMENT_CI_STOP; else inner and outer stop
  reserved: true
  status: agreed
  sprint: 3

- key: SVCLAIM
  field: INFO
  number: A
  type: String
  description: Claim made by the structural variant call. Valid values are D, J, DJ for abundance, adjacency and both respectively
  source: D (abundance) by default, which copy number gain and loss also imply (ticket 10, decided 2026-11-20); deriving it from the study's detection method is a later ticket
  reserved: true
  status: agreed
  sprint: 3

- key: VC
  field: INFO
  number: 1
  type: String
  description: 'Variant class according to the Sequence Ontology'
  source: 'VARIANT_REGION_TYPE_CV / VARIANT_CALL_TYPE_CV -> SEQUENCE_ONTOLOGY_CV.SEQUENCE_ONTOLOGY_ID. Same key, description and value format (an SO accession) as the EVA release'
  reserved: false
  status: agreed
  sprint: 3

- key: SUBMITTED_VARIANT_TYPE
  field: INFO
  number: 1
  type: String
  description: 'Variant type given by the submitter, when it differs from the DGVa type beyond case and separators'
  source: 'VARIANT_CALL.SUBMITTER_VARIANT_CALL_TYPE, VARIANT_REGION.SUBMITTER_VARIANT_REGION_TYPE (gap rows 86, 108)'
  reserved: false
  status: agreed
  sprint: 4

- key: PARENT_REGION_ACCESSION
  field: INFO
  number: .
  type: String
  description: 'DGVa accession of the variant region(s) this variant supports'
  source: 'LINKED_VARIANT (call to region, and region to region)'
  reserved: false
  status: agreed
  sprint: 3

- key: REGION_ASSERTION_METHOD
  field: INFO
  number: 1
  type: String
  description: 'Method by which the variant region is asserted from the supporting variant call(s)'
  source: 'VARIANT_REGION.VAR_REG_ASSERT_METHOD_ID -> VAR_REG_ASSERT_METHOD.ASSERTION_METHOD. Also in the metadata when it is the same for the whole study (sprint 4)'
  reserved: false
  status: agreed
  sprint: 3

- key: PLACEMENT_METHOD
  field: INFO
  number: 1
  type: String
  description: 'DGVa placement method, written when it is not Submitted genomic (for example Submitted cytogenetic, where the coordinates were computed by NCBI from the cytoband)'
  source: 'VARIANT_PLACEMENT_METHOD.VARIANT_PLACEMENT_METHOD. The study default goes in the metadata (sprint 4)'
  reserved: false
  status: agreed
  sprint: 3

- key: EVENT
  field: INFO
  number: A
  type: String
  description: 'ID of associated event'
  source: 'The DGVa accession, on every record of a variant written as several records: alternative locations, pieces, breakend pairs and the breakpoints of complex rearrangements (ticket 10, point 4)'
  reserved: true
  status: agreed
  sprint: 3

- key: EVENTTYPE
  field: INFO
  number: A
  type: String
  description: 'Type of associated event'
  source: 'TRA for translocations; COMPLEX (declared in a ##EVENTTYPE header line) for complex chromosomal rearrangements (ticket 10, point 4)'
  reserved: true
  status: agreed
  sprint: 3

- key: MATEID
  field: INFO
  number: A
  type: String
  description: 'ID of mate breakend'
  source: 'The other breakpoint of a translocation submitted as two placements (ticket 10, point 4)'
  reserved: true
  status: agreed
  sprint: 3

- key: PLACEMENT_RANK
  field: INFO
  number: 1
  type: String
  description: 'DGVa placement rank on the assembly (BestAvailable, NotBest, Artifact)'
  source: 'VAR_PLAC_PLACEMENT_RANK.PLACEMENT_RANK (gap row 115). Written on variants with several records from sprint 3; on every record from sprint 4'
  reserved: false
  status: agreed
  sprint: 3

- key: CN
  field: INFO
  number: A
  type: Float
  description: Copy number of CNV/breakpoint
  source: VARIANT_CALL_COPY_NUMBER; ESTD214_CALLS_CN, ESTD219_CALLS_CN (load tables)
  reserved: true
  status: proposed
  sprint: 4

- key: AF
  field: INFO
  number: A
  type: Float
  description: Allele frequency, for each ALT allele, in the same order as listed ('.' where DGVa has no frequency)
  source: ALLELE_FREQUENCY; ESTD219_CALLS_CN (load table). Written as '.' on every line of a VCF with no samples
  reserved: true
  status: agreed
  sprint: 3

- key: RUC
  field: INFO
  number: A
  type: Float
  description: Repeat unit count corresponding to each alternate allele
  source: VAR_CALL_REPEAT_COUNT, VAR_REG_REPEAT_COUNTS (gap rows 113, 120)
  reserved: true
  status: proposed
  sprint: 4

- key: RUS
  field: INFO
  number: .
  type: String
  description: Repeat unit sequence of the corresponding repeat sequence
  source: VAR_REG_REPEAT_MOTIF (gap row 121)
  reserved: true
  status: proposed
  sprint: 4

- key: HGVS
  field: INFO
  number: .
  type: String
  description: 'HGVS name of the variant placement'
  source: 'VARIANT_PLACEMENT_HGVS.HGVS_NAME (gap row 106)'
  reserved: false
  status: agreed
  sprint: 4

- key: CYTOBAND
  field: INFO
  number: 1
  type: String
  description: 'Cytoband given by the submitter'
  source: 'VARIANT_PLACEMENT_CYTOBAND.CYTOBAND (gap row 105)'
  reserved: false
  status: agreed
  sprint: 4

- key: MUTATION_ORDER
  field: INFO
  number: .
  type: Integer
  description: 'Order of the mutation within a complex event'
  source: 'VAR_PLAC_MUTATION_ORDER, LINKED_VARIANT_MUTATION_ORDER (gap rows 52, 114); 369 rows'
  reserved: false
  status: agreed
  sprint: 4

- key: PLACEMENT_ALT_STATUS
  field: INFO
  number: 1
  type: String
  description: 'DGVa alt status of the placement (Known or Ambiguous)'
  source: 'VARIANT_PLACEMENT_ALT_STATUS.ALT_STATUS (gap row 93). Dropped if it only repeats PLACEMENT_RANK (to check)'
  reserved: false
  status: agreed
  sprint: 4

- key: VALIDATED
  field: INFO
  number: 0
  type: Flag
  description: 'Validated by follow-up experiment'
  source: 'VARIANT_CALL_VALIDATION.VALIDATION_RESULT, when positive (gap row 91). The validation experiment goes in the metadata'
  reserved: true
  status: agreed
  sprint: 4

- key: VALIDATION_RESULT
  field: INFO
  number: .
  type: String
  description: 'Result of each validation of the variant'
  source: 'VARIANT_CALL_VALIDATION.VALIDATION_RESULT (gap row 91). Only if its values say more than VALIDATED'
  reserved: false
  status: proposed
  sprint: 4

- key: SUBMITTED_SEQUENCE
  field: INFO
  number: 1
  type: String
  description: 'Sequence submitted for the variant that cannot be written as an allele'
  source: 'VARIANT_CALL_SEQUENCE.VARIANT_CALL_SEQ, when it is not an allele (gap row 89)'
  reserved: false
  status: agreed
  sprint: 4

- key: SUBMITTER_VARIANT_ID
  field: INFO
  number: 1
  type: String
  description: 'Identifier of the variant given by the submitter'
  source: 'VARIANT_STUDY.SUBMITTER_VARIANT_ID (docs/edge-cases.md, section 4c)'
  reserved: false
  status: agreed
  sprint: 4

- key: DESCRIPTION
  field: INFO
  number: 1
  type: String
  description: 'Description of the variant given by the submitter'
  source: 'VARIANT_DESCRIPTION (docs/edge-cases.md, section 4c)'
  reserved: false
  status: agreed
  sprint: 4

- key: PHENOTYPE
  field: INFO
  number: .
  type: String
  description: 'Phenotype(s) associated with the variant by the submitter'
  source: 'Phenotype tables (docs/edge-cases.md, section 4c)'
  reserved: false
  status: agreed
  sprint: 4

- key: EXTERNAL_LINKS
  field: INFO
  number: .
  type: String
  description: 'Links to the variant in external databases'
  source: 'Dbxref and support link tables (docs/edge-cases.md, section 4c)'
  reserved: false
  status: agreed
  sprint: 4

- key: CLNSIG
  field: INFO
  number: .
  type: String
  description: 'Clinical significance of the variant'
  source: 'Clinical significance tables (docs/edge-cases.md, section 4c). Community name (ClinVar, dbVar) kept rather than a long one, so that tools recognise it'
  reserved: false
  status: agreed
  sprint: 4

- key: AC
  field: INFO
  number: A
  type: Integer
  description: 'Allele count in genotypes, for each ALT allele, in the same order as listed'
  source: 'docs/edge-cases.md, section 4c'
  reserved: true
  status: agreed
  sprint: 4

- key: AN
  field: INFO
  number: 1
  type: Integer
  description: 'Total number of alleles in called genotypes'
  source: 'docs/edge-cases.md, section 4c'
  reserved: true
  status: agreed
  sprint: 4

- key: SOMATIC
  field: INFO
  number: 0
  type: Flag
  description: 'Somatic mutation (for cancer genomics)'
  source: 'Variant origin, when somatic (docs/edge-cases.md, section 4c)'
  reserved: true
  status: agreed
  sprint: 4

- key: GT
  field: FORMAT
  number: 1
  type: String
  description: Genotype
  source: VARIANT_CALL_ZYGOSITY and the species' ploidy (etc/ploidy.yaml); 1/. on a diploid sequence when no zygosity is recorded
  reserved: true
  status: agreed
  sprint: 4

- key: CN
  field: FORMAT
  number: 1
  type: Float
  description: Copy number genotype for imprecise events
  source: VARIANT_CALL_COPY_NUMBER.COPY_NUMBER, for the call's sample
  reserved: true
  status: proposed
  sprint: 4
